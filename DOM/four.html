<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chai Aur Code</title>
</head>
<body style="background-color: black; color: aliceblue;">
    <ul class="language">
        <li>Javascript</li>
    </ul>
</body>

<script>

    function addLanguage(langName){ // less optimised
        const li = document.createElement('li');
        li.innerHTML=`${langName}`; //reason for less optimised(whole traversal)
        document.querySelector('.language').appendChild(li);
    }
    addLanguage('Python');
    addLanguage('Java'); 

    function addOptiLang(langName){
        const li = document.createElement('li');
        li.appendChild(document.createTextNode(langName));
        document.querySelector('.language').appendChild(li);
    }
    addOptiLang("Typescript");
    addOptiLang("Ruby");

    // Edit values 
    const secLang = document.querySelector("li:nth-child(2)")
    //secLang.innerHTML = "Mojo"   // not optimised way
    const newli = document.createElement("li");
    newli.textContent="Mojo";
    secLang.replaceWith(newli);

</script>

</html>
