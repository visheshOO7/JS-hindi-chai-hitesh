<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Scheme Switcher</title>
</head>

<body>

    <h1>Color Scheme Switcher</h1>

    <div>
        <button class="button" id="grey"></button>
        <button class="button" id="white"></button>
        <button class="button" id="blue"></button>
        <button class="button" id="yellow"></button>
    </div>

    <h2>Click a color to change the background!</h2>


<style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 100px;
            transition: background-color 0.3s;
            background-color: rgb(48, 44, 44);
            color:black;
        }

        h1 {
            margin-bottom: 30px;
        }

        .button {
            width: 100px;
            height: 100px;
            display: inline-block;
            margin: 10px;
            border: 2px solid black;
            border-radius: 10px;
            cursor: pointer;
        }

        #grey {
            background-color: grey;
        }

        #white {
            background-color: white;
        }

        #blue {
            background-color: blue;
        }

        #yellow {
            background-color: yellow;
        }
    </style>

</body>

<script src="script.js"></script>
</html>
